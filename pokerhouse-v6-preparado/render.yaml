services:
  - type: web
    name: poker-house-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build --workspace @poker-house/api
    startCommand: npm run start --workspace @poker-house/api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: poker-house-web
    runtime: static
    buildCommand: npm install && npm run build --workspace @poker-house/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
